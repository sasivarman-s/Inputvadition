<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A login form to user validation">
    <title>LOGIN PAGE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="WEB/css/satoshi.css">
</head>

<body >
    <main class="p-[15px]">
        <div class="max-w-[100%]">
            <div class="w-[85%] mx-auto grid grid-cols-1 gap-5 bg-lime-200 p-5 rounded-xl space-y-5">
                <div class="flex flex-col items-center space-y-5">
                    <h1 class="text-5xl">Welcome to this page</h1>
                    <h2 class="text-3xl">Fill the fields to login</h2>
                </div>
                <div class="flex flex-col justify-center items-center">
                    <label class="text-2xl">Email:</label>
                    <input type="email" name="Email" id="email" class="p-[5px] rounded-lg border w-[200px]" placeholder="Enter your Email" required>
                    <p class="text-red-600" id="info1"> </p>
                </div>
                <div class="flex flex-col justify-center items-center">
                    <label class="text-2xl">Password:</label>
                    <input type="text" name="pass" id="pass" class="p-[5px] rounded-lg border w-[200px]"  placeholder="Enter your password" required>
                    <p class="text-red-600" id="info2"> </p>
                </div>
                <div class="flex flex-col justify-center items-center">
                    <button class="bg-green-500 text-white rounded-full py-4 px-10 hover:bg-green-800" type="submit" id="btn">Submit</button>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="script.js"></script>

</html>
